services:
  postgres:
    build:
      context: ./postgres
    image: kodocode-postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kodocode}
      POSTGRES_USER: ${POSTGRES_USER:-kodocode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kodocode_dev}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks:
      - backend_database

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kodocode}
      DATABASE_USERNAME: ${POSTGRES_USER:-kodocode}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-kodocode_dev}
      KODO_JWT_SECRET: ${KODO_JWT_SECRET:?Defina KODO_JWT_SECRET com ao menos 32 caracteres}
      KODO_CORS_ALLOWED_ORIGINS: ${KODO_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      KODO_EMAILJS_ENABLED: ${KODO_EMAILJS_ENABLED:-false}
      KODO_EMAILJS_NOTIFICATION_TO: ${KODO_EMAILJS_NOTIFICATION_TO:-}
      KODO_EMAILJS_ENDPOINT: ${KODO_EMAILJS_ENDPOINT:-https://api.emailjs.com/api/v1.0/email/send}
      KODO_EMAILJS_SERVICE_ID: ${KODO_EMAILJS_SERVICE_ID:-}
      KODO_EMAILJS_NOTIFICATION_TEMPLATE_ID: ${KODO_EMAILJS_NOTIFICATION_TEMPLATE_ID:-}
      KODO_EMAILJS_CONFIRMATION_TEMPLATE_ID: ${KODO_EMAILJS_CONFIRMATION_TEMPLATE_ID:-}
      KODO_EMAILJS_PUBLIC_KEY: ${KODO_EMAILJS_PUBLIC_KEY:-}
      KODO_EMAILJS_PRIVATE_KEY: ${KODO_EMAILJS_PRIVATE_KEY:-}
      KODO_EMAILJS_MINIMUM_REQUEST_INTERVAL: ${KODO_EMAILJS_MINIMUM_REQUEST_INTERVAL:-1100ms}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    networks:
      - frontend_backend
      - backend_database

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
        API_INTERNAL_URL: http://backend:8080
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
    environment:
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
      API_INTERNAL_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    networks:
      - frontend_backend

volumes:
  postgres_data:

networks:
  frontend_backend:
  backend_database:
    internal: true
